# E2E-tier overlay, applied by scripts/e2e.sh as
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml --env-file .env.e2e
#
# Two isolation jobs, so the tier can run beside a developer's own stack and
# behaves identically on a CI runner:
#   - unique container names (the base file pins tms-postgres etc., which a
#     second project would otherwise collide on);
#   - the app's env_file layering replaced wholesale with the tracked .env.e2e,
#     so a developer's .env can never leak settings into the tier.
# Host ports are NOT overridden here: they are compose interpolations in the
# base file, and .env.e2e supplies E2E-specific values for them. Volumes are
# unnamed, so the tier's compose project keeps its own fresh state.
services:
  postgres:
    container_name: tms-e2e-postgres
  clickhouse:
    container_name: tms-e2e-clickhouse
  mailpit:
    container_name: tms-e2e-mailpit
    ports: !override
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1026}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8026}:8025"
  app:
    container_name: tms-e2e-app
    env_file: !override
      - .env.e2e
    # The base healthcheck probes /health/ready, which reports DOWN without a
    # chain connection. This tier runs no node or Ogmios on purpose (the specs
    # assert on seeded findings), so readiness would sit red for reasons the
    # tier does not test. Probe liveness instead: the API answering is exactly
    # what the suite needs, and scripts/e2e.sh polls the same endpoint.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
